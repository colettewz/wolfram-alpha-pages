<!DOCTYPE html>
<!-- Derivative — do not edit. Regenerate from the design source; this copy is
     self-contained (stylesheets and artwork inlined). -->

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolfram|Alpha — Site Nav · presentation board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>

  :root { --ink-1:#333; --ink-2:#666; --ink-3:#999; --line:#DFDFDF; --canvas:#E8E8E8; --card:#FFF; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--canvas); color: var(--ink-1);
         font-family: 'Source Sans Pro', system-ui, sans-serif; }

  .chrome { position: fixed; inset: 0 0 auto 0; z-index: 10; height: 44px;
            display: flex; align-items: center; gap: 20px; padding: 0 20px;
            background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line); }
  .chrome h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  .spacer { flex: 1; }

  .stage { position: fixed; inset: 44px 0 0 0; overflow: auto; }
  .board { transform-origin: 0 0; padding: 16px; width: max-content; }

  .row { display: flex; gap: 20px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .col > h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink-1); }

  .card { background: var(--card); border: 1px solid #CECECE; border-radius: 12px; overflow: hidden; }
  .card__bar { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
               background: #FAFAFA; border-bottom: 1px solid #EFEFEF;
               font-size: 13px; font-weight: 700; letter-spacing: .05em;
               text-transform: uppercase; color: #555; }
  .band { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .band--light { background: #F7F7F7; }
  .band--dark  { background: #262626; }
  .band__bar { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #777; }
  .band--dark .band__bar { color: #9A9A9A; }

  figure { margin: 0; }
  figcaption { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 5px; }
  .band--dark figcaption { color: #BDBDBD; }
  .well { border: 1px solid var(--line); border-radius: 6px; background: #FFF; overflow: hidden; }
  .band--dark .well { border-color: #444; background: #333; }
  .well iframe { display: block; border: 0; }

  .well--crop { width: 1128px; overflow: hidden; }
  .well--crop iframe { margin-left: -156px; }

  .mob { display: flex; gap: 10px; align-items: flex-start; }

  @media print { .chrome { display: none; } .stage { position: static; } }
</style>
</head>
<body>

<div class="chrome">
  <h1>Wolfram|Alpha — Site Nav</h1>
  <div class="spacer"></div>
</div>

<div class="stage" id="stage">
  <div class="board" id="board">
    <div class="row">

      <div class="col" data-col="desktop">
        <h2>Desktop · 1440</h2>
        <div class="card">
          <div class="tblock" data-theme="light">
          <div class="card__bar">Light mode</div>
          <div class="band band--light">
            <figure><figcaption>Signed in</figcaption>
              <div class="well well--crop"><iframe data-src="nav.html?embed&amp;user=in" width="1440" height="56" title="Desktop signed in"></iframe></div></figure>
            <figure><figcaption>Signed in — PRO menu open</figcaption>
              <div class="well well--crop"><iframe data-src="nav.html?embed&amp;user=in&amp;menu=menu-pro" width="1440" height="207" title="Desktop signed in, PRO open"></iframe></div></figure>
            <figure><figcaption>Signed out</figcaption>
              <div class="well well--crop"><iframe data-src="nav.html?embed&amp;user=out" width="1440" height="56" title="Desktop signed out"></iframe></div></figure>
          </div>
          </div>
          <div class="tblock" data-theme="dark">
          <div class="card__bar">Dark mode</div>
          <div class="band band--dark">
            <figure><figcaption>Signed in</figcaption>
              <div class="well well--crop"><iframe data-src="nav.html?embed&amp;user=in&amp;theme=dark" width="1440" height="56" title="Desktop signed in, dark"></iframe></div></figure>
            <figure><figcaption>Signed in — PRO menu open</figcaption>
              <div class="well well--crop"><iframe data-src="nav.html?embed&amp;user=in&amp;menu=menu-pro&amp;theme=dark" width="1440" height="207" title="Desktop signed in PRO open, dark"></iframe></div></figure>
            <figure><figcaption>Signed out</figcaption>
              <div class="well well--crop"><iframe data-src="nav.html?embed&amp;user=out&amp;theme=dark" width="1440" height="56" title="Desktop signed out, dark"></iframe></div></figure>
          </div>
          </div>
        </div>
      </div>

      <div class="col" data-col="mobile">
        <h2>Mobile · 375</h2>
        <div class="card">
          <div class="card__bar">Light &amp; dark</div>
          <div class="mob">
            <div class="band band--light tblock" data-theme="light">
              <div class="band__bar">LIGHT</div>
              <figure><figcaption>Closed</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out" width="375" height="48" title="Mobile closed"></iframe></div></figure>
              <figure><figcaption>Signed in — PRO open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=in&amp;sheet=1&amp;sub=sub-pro" width="375" height="408" title="Mobile signed in, PRO open"></iframe></div></figure>
              <figure><figcaption>Signed out — menu open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out&amp;sheet=1" width="375" height="372" title="Mobile signed out, menu open"></iframe></div></figure>
            </div>
            <div class="band band--dark tblock" data-theme="dark">
              <div class="band__bar">DARK</div>
              <figure><figcaption>Closed</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out&amp;theme=dark" width="375" height="48" title="Mobile closed, dark"></iframe></div></figure>
              <figure><figcaption>Signed in — PRO open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=in&amp;sheet=1&amp;sub=sub-pro&amp;theme=dark" width="375" height="408" title="Mobile signed in PRO open, dark"></iframe></div></figure>
              <figure><figcaption>Signed out — menu open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out&amp;sheet=1&amp;theme=dark" width="375" height="372" title="Mobile signed out menu open, dark"></iframe></div></figure>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var board = document.getElementById('board'),
      stage = document.getElementById('stage');

  [].forEach.call(document.querySelectorAll('iframe[data-src]'), function (f) {
    f.style.width = f.getAttribute('width') + 'px';
    f.style.height = f.getAttribute('height') + 'px';
  });

  var wrap = document.createElement('div'), scale = 1;
  stage.insertBefore(wrap, board);
  wrap.appendChild(board);

  function natural() {

    var t = board.style.transform, ww = wrap.style.width, wh = wrap.style.height;
    board.style.transform = 'none';
    wrap.style.width = 'auto'; wrap.style.height = 'auto';
    var w = board.scrollWidth, hh = board.scrollHeight;
    board.style.transform = t; wrap.style.width = ww; wrap.style.height = wh;
    return { w: w, h: hh };
  }
  function apply() {
    var n = natural();
    board.style.transform = 'scale(' + scale + ')';
    wrap.style.width = (n.w * scale) + 'px';
    wrap.style.height = (n.h * scale) + 'px';
  }
  function fit() {
    var n = natural();
    scale = Math.min((stage.clientWidth - 24) / n.w, (stage.clientHeight - 24) / n.h);
    apply();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === '+' || e.key === '=') scale *= 1.25;
    else if (e.key === '-' || e.key === '_') scale /= 1.25;
    else if (e.key === '0') scale = 1;
    else if (e.key === 'f' || e.key === 'F') { fit(); e.preventDefault(); return; }
    else return;
    scale = Math.max(.1, Math.min(4, scale)); apply(); e.preventDefault();
  });
  window.addEventListener('resize', fit);

  var frames = [].slice.call(document.querySelectorAll('iframe[data-src]')), left = frames.length;
  frames.forEach(function (f) {
    f.addEventListener('load', function () { if (--left === 0) fit(); });
    f.src = f.dataset.src;
  });
  fit();
})();
</script>
</body>
</html>
