<!DOCTYPE html>
<!-- Derivative — do not edit. Regenerate from the design source; this copy is
     self-contained (stylesheets and artwork inlined). -->

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolfram|Alpha — Site Nav · presentation board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>

  :root { --ink-1:#333; --ink-2:#666; --ink-3:#999; --line:#DFDFDF; --canvas:#E8E8E8; --card:#FFF; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--canvas); color: var(--ink-1);
         font-family: 'Source Sans Pro', system-ui, sans-serif; }

  .chrome { position: fixed; inset: 0 0 auto 0; z-index: 10; height: 52px;
            display: flex; align-items: center; gap: 20px; padding: 0 20px;
            background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line); }
  .chrome h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  .chrome h1 small { font-weight: 600; color: var(--ink-3); margin-left: 8px; }
  .spacer { flex: 1; }
  .zoom { display: inline-flex; align-items: center; gap: 2px;
          border: 1px solid #CECECE; border-radius: 7px; overflow: hidden; background: #FFF; }
  .zoom button { appearance: none; border: 0; border-right: 1px solid #E8E8E8; background: #FFF;
                 font: 600 13px/1 inherit; color: var(--ink-2); padding: 8px 12px; cursor: pointer; }
  .zoom button:last-child { border-right: 0; }
  .zoom button:hover { background: #F5F5F5; color: var(--ink-1); }
  .zoom button.on { background: var(--ink-1); color: #FFF; }
  .pct { font: 600 13px/1 inherit; color: var(--ink-3); min-width: 42px; text-align: right;
         font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--ink-3); }

  .stage { position: fixed; inset: 52px 0 0 0; overflow: auto; }
  .board { transform-origin: 0 0; padding: 28px; width: max-content; }

  .row { display: flex; gap: 28px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col > h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--ink-1); }

  .card { background: var(--card); border: 1px solid #CECECE; border-radius: 12px; overflow: hidden; }
  .card__bar { display: flex; align-items: center; gap: 10px; padding: 9px 16px;
               background: #FAFAFA; border-bottom: 1px solid #EFEFEF;
               font-size: 13px; font-weight: 700; letter-spacing: .05em;
               text-transform: uppercase; color: #555; }
  .card__bar .dots { display: inline-flex; gap: 5px; }
  .card__bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: #DDD; }
  .band { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .band--light { background: #F7F7F7; }
  .band--dark  { background: #262626; }
  .band__bar { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #777; }
  .band--dark .band__bar { color: #9A9A9A; }

  figure { margin: 0; }
  figcaption { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 7px; }
  .band--dark figcaption { color: #BDBDBD; }
  .well { border: 1px solid var(--line); border-radius: 6px; background: #FFF; overflow: hidden; }
  .band--dark .well { border-color: #444; background: #333; }
  .well iframe { display: block; border: 0; }

  .mob { display: flex; gap: 14px; align-items: flex-start; }

  .board[data-theme="light"] .mob .band,
  .board[data-theme="dark"]  .mob .band { flex-direction: row; align-items: flex-start; }
  .board[data-theme="light"] .mob .band__bar,
  .board[data-theme="dark"]  .mob .band__bar { display: none; }

  .board[data-theme="light"] .tblock[data-theme="dark"],
  .board[data-theme="dark"]  .tblock[data-theme="light"] { display: none; }
  .board[data-view="desktop"] [data-col="mobile"],
  .board[data-view="mobile"]  [data-col="desktop"] { display: none; }

  @media print { .chrome { display: none; } .stage { position: static; } }
</style>
</head>
<body>

<div class="chrome">
  <h1>Wolfram|Alpha — Site Nav <small>every state, 1:1 · light + dark</small></h1>
  <div class="spacer"></div>
  <span class="hint">1 2 3 platform · L D B theme · + &minus; 0 zoom · F fit</span>
  <span class="zoom" id="view">
    <button data-view="all" class="on">All</button>
    <button data-view="desktop">Desktop</button>
    <button data-view="mobile">Mobile</button>
  </span>
  <span class="zoom" id="theme">
    <button data-theme="both" class="on">Both</button>
    <button data-theme="light">Light</button>
    <button data-theme="dark">Dark</button>
  </span>
  <span class="zoom">
    <button data-fit="1" class="on">Fit</button>
    <button data-z="1">100%</button>
    <button data-step="-1">&minus;</button>
    <button data-step="1">+</button>
  </span>
  <span class="pct" id="pct">—</span>
</div>

<div class="stage" id="stage">
  <div class="board" id="board">
    <div class="row">

      <div class="col" data-col="desktop">
        <h2>Desktop · 1440</h2>
        <div class="card">
          <div class="tblock" data-theme="light">
          <div class="card__bar"><span class="dots"><i></i><i></i><i></i></span> Light mode</div>
          <div class="band band--light">
            <figure><figcaption>Signed in</figcaption>
              <div class="well"><iframe data-src="nav.html?embed&amp;user=in" width="1440" height="56" title="Desktop signed in"></iframe></div></figure>
            <figure><figcaption>Signed in — PRO menu open</figcaption>
              <div class="well"><iframe data-src="nav.html?embed&amp;user=in&amp;menu=menu-pro" width="1440" height="207" title="Desktop signed in, PRO open"></iframe></div></figure>
            <figure><figcaption>Signed out</figcaption>
              <div class="well"><iframe data-src="nav.html?embed&amp;user=out" width="1440" height="56" title="Desktop signed out"></iframe></div></figure>
          </div>
          </div>
          <div class="tblock" data-theme="dark">
          <div class="card__bar"><span class="dots"><i></i><i></i><i></i></span> Dark mode</div>
          <div class="band band--dark">
            <figure><figcaption>Signed in</figcaption>
              <div class="well"><iframe data-src="nav.html?embed&amp;user=in&amp;theme=dark" width="1440" height="56" title="Desktop signed in, dark"></iframe></div></figure>
            <figure><figcaption>Signed in — PRO menu open</figcaption>
              <div class="well"><iframe data-src="nav.html?embed&amp;user=in&amp;menu=menu-pro&amp;theme=dark" width="1440" height="207" title="Desktop signed in PRO open, dark"></iframe></div></figure>
            <figure><figcaption>Signed out</figcaption>
              <div class="well"><iframe data-src="nav.html?embed&amp;user=out&amp;theme=dark" width="1440" height="56" title="Desktop signed out, dark"></iframe></div></figure>
          </div>
          </div>
        </div>
      </div>

      <div class="col" data-col="mobile">
        <h2>Mobile · 375</h2>
        <div class="card">
          <div class="card__bar"><span class="dots"><i></i><i></i><i></i></span> <span id="mobBar">Light &amp; dark</span></div>
          <div class="mob">
            <div class="band band--light tblock" data-theme="light">
              <div class="band__bar">LIGHT</div>
              <figure><figcaption>Closed</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out" width="375" height="48" title="Mobile closed"></iframe></div></figure>
              <figure><figcaption>Signed in — PRO open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=in&amp;sheet=1&amp;sub=sub-pro" width="375" height="408" title="Mobile signed in, PRO open"></iframe></div></figure>
              <figure><figcaption>Signed out — menu open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out&amp;sheet=1&amp;sub=sub-apps" width="375" height="612" title="Mobile signed out, menu open"></iframe></div></figure>
            </div>
            <div class="band band--dark tblock" data-theme="dark">
              <div class="band__bar">DARK</div>
              <figure><figcaption>Closed</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out&amp;theme=dark" width="375" height="48" title="Mobile closed, dark"></iframe></div></figure>
              <figure><figcaption>Signed in — PRO open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=in&amp;sheet=1&amp;sub=sub-pro&amp;theme=dark" width="375" height="408" title="Mobile signed in PRO open, dark"></iframe></div></figure>
              <figure><figcaption>Signed out — menu open</figcaption>
                <div class="well"><iframe data-src="nav.html?embed&amp;user=out&amp;sheet=1&amp;sub=sub-apps&amp;theme=dark" width="375" height="612" title="Mobile signed out menu open, dark"></iframe></div></figure>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var board = document.getElementById('board'),
      stage = document.getElementById('stage'),
      pct   = document.getElementById('pct'),
      zoom  = document.querySelector('.zoom');

  [].forEach.call(document.querySelectorAll('iframe[data-src]'), function (f) {
    f.style.width = f.getAttribute('width') + 'px';
    f.style.height = f.getAttribute('height') + 'px';
  });

  var scale = 1, fitting = true;
  var wrap = document.createElement('div');

  function natural() {

    var t = board.style.transform, w0 = board.style.width,
        ww = wrap.style.width, wh = wrap.style.height;
    board.style.transform = 'none'; board.style.width = 'max-content';
    wrap.style.width = 'auto'; wrap.style.height = 'auto';
    var w = board.scrollWidth, h = board.scrollHeight;
    board.style.transform = t; board.style.width = w0;
    wrap.style.width = ww; wrap.style.height = wh;
    return { w: w, h: h };
  }
  function apply() {
    var n = natural();
    board.style.transform = 'scale(' + scale + ')';
    pct.textContent = Math.round(scale * 100) + '%';
    [].forEach.call(zoom.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', (fitting && b.dataset.fit) || (!fitting && b.dataset.z && scale === 1));
    });

    wrap.style.width = (n.w * scale) + 'px';
    wrap.style.height = (n.h * scale) + 'px';
  }

  stage.insertBefore(wrap, board);
  wrap.appendChild(board);

  function fit() {
    fitting = true;
    var n = natural();
    scale = Math.min((stage.clientWidth - 40) / n.w, (stage.clientHeight - 40) / n.h);
    apply();
  }
  function set(z) { fitting = false; scale = Math.max(.1, Math.min(4, z)); apply(); }

  var viewBar = document.getElementById('view');
  function setView(v) {
    board.dataset.view = v;
    [].forEach.call(viewBar.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.dataset.view === v);
    });
    fit();
  }
  var themeBar = document.getElementById('theme');
  function setTheme(t) {
    board.dataset.theme = t;
    [].forEach.call(themeBar.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.dataset.theme === t);
    });
    var mb = document.getElementById('mobBar');
    if (mb) mb.textContent = t === 'both' ? 'Light & dark' : (t === 'light' ? 'Light mode' : 'Dark mode');
    fit();
  }
  themeBar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setTheme(b.dataset.theme);
  });

  viewBar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) setView(b.dataset.view);
  });

  zoom.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.fit) fit();
    else if (b.dataset.z) set(parseFloat(b.dataset.z));
    else set(scale * (b.dataset.step === '1' ? 1.25 : 1 / 1.25));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '+' || e.key === '=') set(scale * 1.25);
    else if (e.key === '-' || e.key === '_') set(scale / 1.25);
    else if (e.key === '0') set(1);
    else if (e.key === 'f' || e.key === 'F') fit();
    else if (e.key === '1') setView('all');
    else if (e.key === '2') setView('desktop');
    else if (e.key === '3') setView('mobile');
    else if (e.key === 'l' || e.key === 'L') setTheme('light');
    else if (e.key === 'd' || e.key === 'D') setTheme('dark');
    else if (e.key === 'b' || e.key === 'B') setTheme('both');
    else return;
    e.preventDefault();
  });
  window.addEventListener('resize', function () { if (fitting) fit(); });

  var frames = [].slice.call(document.querySelectorAll('iframe[data-src]')), left = frames.length;
  frames.forEach(function (f) {
    f.addEventListener('load', function () { if (--left === 0 && fitting) fit(); });
    f.src = f.dataset.src;
  });
  board.dataset.view = 'all';
  board.dataset.theme = 'both';
  fit();
})();
</script>
</body>
</html>
